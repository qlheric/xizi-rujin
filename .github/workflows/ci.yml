name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "tiktoken>=0.14.0"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Compression benchmark (能红断言)
        run: python -m eval.compress_bench
      - name: Semantic fidelity (阴性对照)
        run: python -m eval.semantic_eval
