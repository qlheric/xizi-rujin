name: eval

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Anti-fake-green tests
        run: python -m unittest tests.test_fake_green tests.test_mutation_test tests.test_skill_install
      - name: README demo matches the tool
        run: python -m unittest tests.test_readme
      - name: Toolchain bench group 4 (no LLM)
        run: |
          python -m eval.bench
          python -m eval.bench --dir eval/traps_v2

  stop-hook-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stop hook tests
        run: python -m unittest tests.test_stop_hook -v
